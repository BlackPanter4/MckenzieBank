<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<title>McKenzie Bank Q777</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: system-ui, sans-serif}
body{background:#0e0e0e;color:white;padding-bottom:90px}
.header{padding:20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;color:#D4AF37;letter-spacing:1px}
.id{font-size:12px;background:#1e1e1e;padding:6px 10px;border-radius:20px;color:#aaa}
.saldo{background:linear-gradient(135deg,#1a1a1a,#2a2a2a);margin:15px;border-radius:20px;padding:20px;border:1px solid #D4AF3733}
.saldo small{color:#888} .monto{font-size:36px;font-weight:900;margin:10px 0}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 15px}
.btn4{background:#1e1e1e;border-radius:16px;padding:14px 5px;text-align:center;border:1px solid #2a2a2a}
.btn4 span{font-size:22px;display:block} .btn4 p{font-size:11px;margin-top:4px}
.titulo{padding:20px 15px 10px;font-weight:700}
.market{display:grid;gap:10px;padding:0 15px}
.coin{background:#1a1a1a;border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;border:1px solid #222}
.coin b{color:#D4AF37} .price{text-align:right}
.buy{background:#D4AF37;color:black;border:none;padding:8px 14px;border-radius:20px;font-weight:800;margin-top:5px}
.modal{position:fixed;inset:0;background:#000000cc;display:none;align-items:end;z-index:99}
.modal-box{background:#1e1e1e;width:100%;border-radius:25px 25px 0 0;padding:20px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#111;color:white;margin:10px 0;font-size:16px}
</style>
</head>
<body>
<div class="header">
<div class="logo">McKENZIE BANK Q777</div>
<div class="id" id="myId">ID: 7770-9432-6039</div>
</div>

<div class="saldo">
<small>SALDO DISPONIBLE</small>
<div class="monto" id="saldo">$ 4,250.00 MXN</div>
<small id="holdings">Portafolio: $0 en activos</small>
</div>

<div class="grid4">
<div class="btn4" onclick="accion('Enviar')"><span>↑</span><p>Enviar</p></div>
<div class="btn4" onclick="accion('Recibir')"><span>↓</span><p>Recibir</p></div>
<div class="btn4" onclick="accion('Retirar')"><span>◫</span><p>Retirar</p></div>
<div class="btn4" onclick="accion('Pagar')"><span>₱</span><p>Pagar</p></div>
</div>

<div class="titulo">Comprar / Trading Q777</div>
<div class="market" id="market"></div>

<div class="modal" id="modal"><div class="modal-box">
<h3 id="mTitle">Comprar</h3>
<input type="number" id="mCantidad" placeholder="Cantidad en MXN">
<button class="buy" style="width:100%;padding:14px" onclick="confirmarCompra()">CONFIRMAR COMPRA</button>
<p style="text-align:center;margin-top:12px;color:#888" onclick="cerrar()">Cancelar</p>
</div></div>

<script>
let saldo = 4250;
let portafolio = {};
let activoSel = null;
const activos = [
 {id:'CETES', name:'CETES 28d', price:11.2, change:'+0.45%'},
 {id:'BTC', name:'Bitcoin', price:1123450, change:'+2.1%'},
 {id:'ETH', name:'Ethereum', price:68500, change:'-0.8%'},
 {id:'RUB', name:'Rublo Ruso', price:0.19, change:'+1.3%'},
 {id:'JPY', name:'Yen Japonés', price:0.12, change:'+0.2%'},
 {id:'USD/MXN', name:'Dólar / Peso', price:17.35, change:'-0.1%'},
 {id:'BTC/ETH', name:'BTC / ETH', price:16.4, change:'+0.9%'}
];

function render(){
 document.getElementById('market').innerHTML = activos.map(a=>`
  <div class="coin">
   <div><b>${a.id}</b><br><small style="color:#888">${a.name} • ${a.change}</small></div>
   <div class="price">$${a.price.toLocaleString()}<br><button class="buy" onclick="abrir('${a.id}')">Comprar</button></div>
  </div>
 `).join('');
 document.getElementById('saldo').innerText = `$ ${saldo.toFixed(2)} MXN`;
 let totalAct = Object.values(portafolio).reduce((s,v)=>s+v,0);
 document.getElementById('holdings').innerText = `Portafolio: $${totalAct.toFixed(2)} en activos`;
}
function abrir(id){ activoSel = activos.find(x=>x.id==id); document.getElementById('mTitle').innerText='Comprar '+id; document.getElementById('modal').style.display='flex'; }
function cerrar(){ document.getElementById('modal').style.display='none'; }
function confirmarCompra(){
 let cant = parseFloat(document.getElementById('mCantidad').value);
 if(!cant || cant>saldo) return alert('Saldo insuficiente o cantidad inválida');
 saldo -= cant;
 portafolio[activoSel.id] = (portafolio[activoSel.id]||0)+cant;
 cerrar(); render();
 // Enviar comprobante por WhatsApp a tu registro de Luchanas
 let msg = `McBank Q777 - Compra: ${activoSel.id} por $${cant} MXN. ID: 7770-9432-6039 Saldo restante: $${saldo}`;
 window.open('https://wa.me/5216560000000?text='+encodeURIComponent(msg),'_blank');
}
function accion(t){ alert(t+' - McBank Q777: ID 7770-9432-6039 registrado. Función activa.'); }
render();

// Guarda ID local
localStorage.setItem('mck_id','7770-9432-6039');
</script>
</body>
</html>
